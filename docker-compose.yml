# Local development services. Run: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voltneo
      POSTGRES_PASSWORD: voltneo
      POSTGRES_DB: voltneo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

  # Redis is used by BullMQ background jobs from milestone M3.
  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  pgdata:
