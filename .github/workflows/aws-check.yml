name: AWS check

# Confirms the deploy key in GitHub secrets works and is limited to Lightsail
# in Mumbai (ap-south-1). Prints no key material.
on:
  workflow_dispatch:
  push:
    branches: ['infra-check']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Secrets and region present
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::AWS_ACCESS_KEY_ID secret is missing"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::AWS_SECRET_ACCESS_KEY secret is missing"; exit 1; }
          test "$AWS_REGION" = "ap-south-1" || { echo "::error::AWS_REGION variable is '$AWS_REGION', expected ap-south-1"; exit 1; }
      - name: Key accepted by AWS
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text | sed 's/[0-9]\{12\}/<account>/')
          echo "::notice title=Key belongs to::$arn"
          if aws iam list-users --max-items 1 >/dev/null 2>&1; then echo "::warning title=Too broad::The key can read IAM users"; fi
          if aws s3api list-buckets >/dev/null 2>&1; then echo "::warning title=Too broad::The key can list S3 buckets"; fi
          if aws ec2 describe-regions --region ap-south-1 >/dev/null 2>&1; then echo "::warning title=Too broad::The key can use EC2"; fi
      - name: Lightsail Mumbai reachable
        run: |
          aws lightsail get-instances --region ap-south-1 --query 'length(instances)'
          aws lightsail get-relational-databases --region ap-south-1 --query 'length(relationalDatabases)'
          aws lightsail get-relational-database-bundles --region ap-south-1 \
            --query 'bundles[?isActive && engine==`postgres`].[bundleId,price,ramSizeInGb,isEncrypted]' --output text
          aws lightsail get-bundles --region ap-south-1 \
            --query 'bundles[?isActive && price==`24`].[bundleId,price,ramSizeInGb,transferPerMonthInGb,supportedPlatforms[0]]' --output text
          aws lightsail get-bucket-bundles --region ap-south-1 --query 'bundles[].[bundleId,price,storagePerMonthInGb]' --output text
          aws lightsail get-relational-database-blueprints --region ap-south-1 \
            --query 'blueprints[?engine==`postgres`].blueprintId' --output text
          aws lightsail get-blueprints --region ap-south-1 \
            --query 'blueprints[?platform==`LINUX_UNIX` && starts_with(blueprintId, `ubuntu`)].blueprintId' --output text
      - name: Other regions refused
        run: |
          if aws lightsail get-instances --region us-east-1 >/dev/null 2>&1; then
            echo "::error::The key can reach us-east-1; it should be limited to ap-south-1"; exit 1
          fi
          echo "us-east-1 refused, as intended"
